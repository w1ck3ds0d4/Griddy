name: scrape

on:
  schedule:
    # Every 10 minutes. GitHub may delay or skip individual runs under load;
    # heartbeats make any gap visible and honest in the archive itself.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run scrape cycle
        run: python -m griddy.run

      - name: Verify archive chains
        run: python -m griddy.verify

      - name: Commit and push if changed
        run: |
          git config user.name "griddy-bot"
          git config user.email "griddy-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "(data) scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          # retry once in case a concurrent push landed first
          git push || (git pull --rebase && git push)
